simpleArgs: &simple-args
  initialMoney: 10000
  moneyToTransfer: 100
  numberOfAccounts: &number-of-accounts 1000

test:
  name: simple-query
  description: Rodada de Query (Consulta) - Besu
  workers:
    number: 5
  rounds:
    - label: query
      description: Teste de consulta de contas no Besu.
      txNumber: *number-of-accounts
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: benchmarks/caliper_besu/query.js
        arguments: *simple-args
